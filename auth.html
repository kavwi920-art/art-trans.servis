<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie / Rejestracja | Art-Trans Serwis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #0f1115;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1a1e27;
      border: 1px solid #252a35;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .logo span { color: #ff6b00; }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      background: #13161d;
      border: 1px solid #252a35;
      border-radius: 8px;
      color: #a0a5b5;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
    }
    .tab.active {
      background: #ff6b00;
      color: white;
      border-color: #ff6b00;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #c5c9d4;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #13161d;
      border: 1px solid #252a35;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #ff6b00;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ff6b00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #e05e00; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }
    .message.success {
      background: #0d3320;
      color: #4ade80;
      border: 1px solid #166534;
      display: block;
    }
    .message.error {
      background: #3b1219;
      color: #f87171;
      border: 1px solid #7f1d1d;
      display: block;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #a0a5b5;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { color: #ff6b00; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>Art-Trans</span> Serwis</div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="showLogin()">Logowanie</div>
      <div class="tab" id="tab-register" onclick="showRegister()">Rejestracja</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="jan@firma.pl">
      </div>
      <div class="form-group">
        <label>Hasło</label>
        <input type="password" id="login-password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn" id="login-btn">Zaloguj się</button>
    </form>

    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Imię i nazwisko</label>
        <input type="text" id="reg-name" required placeholder="Jan Kowalski">
      </div>
      <div class="form-group">
        <label>Nazwa firmy</label>
        <input type="text" id="reg-company" required placeholder="Transport Kowalski Sp. z o.o.">
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input type="tel" id="reg-phone" required placeholder="+48 500 000 000">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="jan@firma.pl">
      </div>
      <div class="form-group">
        <label>Hasło (min. 6 znaków)</label>
        <input type="password" id="reg-password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn" id="register-btn">Zarejestruj się</button>
    </form>

    <div id="message" class="message"></div>
    <a href="index.html" class="back">← Wróć na stronę główną</a>
  </div>

  <script src="config.js"></script>
  <script>
    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
        if (profile && profile.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'rezerwacja.html';
        }
      }
    }
    checkSession();

    function showLogin() {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('tab-register').classList.remove('active');
      clearMessage();
    }

    function showRegister() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-register').classList.add('active');
      clearMessage();
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function clearMessage() {
      document.getElementById('message').className = 'message';
      document.getElementById('message').textContent = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logowanie...';

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showMessage(error.message === 'Invalid login credentials' ? 'Nieprawidłowy email lub hasło' : error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Zaloguj się';
        return;
      }

      const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
      if (profile && profile.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'rezerwacja.html';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Rejestracja...';

      const fullName = document.getElementById('reg-name').value;
      const company = document.getElementById('reg-company').value;
      const phone = document.getElementById('reg-phone').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, company_name: company, phone: phone }
        }
      });

      if (error) {
        showMessage(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Zarejestruj się';
        return;
      }

      if (data.user) {
        await sb.from('profiles').update({
          full_name: fullName,
          company_name: company,
          phone: phone
        }).eq('id', data.user.id);
      }

      showMessage('Konto utworzone! Możesz się teraz zalogować.', 'success');
      btn.disabled = false;
      btn.textContent = 'Zarejestruj się';

      setTimeout(() => {
        showLogin();
        document.getElementById('login-email').value = email;
      }, 2000);
    }
  </script>
</body>
</html>
